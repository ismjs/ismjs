name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Node 24 is the active LTS and the floor declared in package.json.
      # The scripts under packages/*/scripts are run by its native type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # The same complete gate contributors run locally: build, formatting,
      # lint, typecheck, coverage, generated-source drift, golden-corpus drift,
      # and package publishability. Building first ensures the artifact tests
      # cannot skip.
      - name: Full verification
        run: bun run check:full
