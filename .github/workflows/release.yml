name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Opens or updates the release pull request from the Conventional Commits on
  # main. Merging that pull request tags the release and creates the GitHub
  # release, which sets `release_created` for the publish job.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      core-released: ${{ steps.release.outputs['packages/core--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # Publishes through npm trusted publishing: the registry accepts the job's
  # OIDC token instead of a stored npm token, and attaches provenance.
  publish-core:
    needs: release-please
    if: needs.release-please.outputs.core-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11.21.3

      - run: bun install --frozen-lockfile

      # The same gate as CI, so the published artifact is the one that passed.
      - name: Full verification
        run: bun run check:full

      - name: Publish @ismjs/core
        working-directory: packages/core
        run: npm publish --provenance --access public
